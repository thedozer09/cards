<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card Game</title>

    <link rel="stylesheet" href="style.css?v=13">
</head>

<body>

    <div id="loadingScreen" class="loadingScreen">

        <div class="loadingContent">

            <div class="loadingSpinner"></div>

            <h1>Loading...</h1>

        </div>

    </div>

    <main id="mainScreen" class="mainScreen hidden">

        <div class="activityContainer">

            <nav class="navigation">

                <button id="generateButton" class="tabButton active" type="button">

                    <span class="tabLabel">GENERATE</span>

                </button>

                <button id="leaderboardsButton" class="tabButton" type="button">

                    <span class="tabLabel">LEADERBOARDS</span>

                </button>

                <button id="cardsButton" class="tabButton" type="button">

                    <span class="tabLabel">CARDS</span>

                </button>

            </nav>

            <section id="generateScreen" class="tabScreen">

                <div class="tabHeader">

                    <span class="tabEyebrow">CARD GAME</span>

                    <h1>Generate</h1>

                </div>

            </section>

            <section id="leaderboardsScreen" class="tabScreen hidden">

                <div class="tabHeader">

                    <span class="tabEyebrow">CARD GAME</span>

                    <h1>Leaderboards</h1>

                </div>

            </section>

            <section id="cardsScreen" class="tabScreen hidden">

                <div class="tabHeader">

                    <span class="tabEyebrow">CARD GAME</span>

                    <h1>Cards</h1>

                </div>

            </section>

        </div>

    </main>

    <div class="scrollRail" aria-hidden="true"></div>

    <div id="screen1" class="hidden"></div>

    <div id="screen2" class="hidden"></div>

    <button id="testButton" class="hidden" type="button"></button>

    <button id="rngButton" class="hidden" type="button"></button>

    <div id="errorMessage" class="error hidden"></div>

    <script src="script.js?v=13"></script>

</body>
</html>
